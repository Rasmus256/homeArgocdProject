apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Users\rasmu\cluster\kompose-windows-amd64.exe convert
    kompose.version: 1.23.0 (bc7d9f4f)
  creationTimestamp: null
  labels:
    io.kompose.service: mcbedrock
  name: mcbedrock
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      io.kompose.service: mcbedrock
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mcbedrock
    spec:
      nodeSelector:
        pi: "false"
      containers:
        - env:
            - name: EULA
              value: "true"
            - name: OPS
              value: "{{ join "," .Values.ops }}"
            - name: TYPE
              value: "BEDROCK"
            - name: MEMORY
              value: "1G"
            - name: SERVER_NAME
              value: "Gry og Albertes Hjemme-Server"
            - name: SERVER_PORT
              value: "19132"
            - name: "GAMEMODE"
              value: "creative" 
            - name: "ALLOW_LIST_USERS"
              value: "{{ join "," .Values.allowlistUsers }}"
            - name: "ALLOW_CHEATS"
              value: "true"
            - name: "SERVER_UDP_PORTS"
              value: "<public_ip>:{{ .Values.udpPortRange.start }}-{{ .Values.udpPortRange.end }}:{{ .Values.udpPortRange.start }}-{{ .Values.udpPortRange.end }}"
            - name: "TRANSPORT"
              value: "nethernet"
            - name: "ENABLE_LAN_VISIBILITY"
              value: "true"
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | toString }}"
          name: mcbedrock
          ports:
            - containerPort: 19132
              protocol: UDP
{{- $start := atoi (printf "%v" .Values.udpPortRange.start) }}
{{- $end := atoi (printf "%v" .Values.udpPortRange.end) }}
{{- $exclusiveEnd := atoi (printf "%d" (add1 $end)) }}
{{- range $port := untilStep $start $exclusiveEnd 1 }}
            - containerPort: {{ $port }}
              protocol: UDP
{{- end }}
            - containerPort: 7551
              protocol: UDP
          resources:
            requests:
              memory: "600Mi"
              cpu: "400m"
            limits:
              memory: "1300Mi"
              cpu: "2000m"
          volumeMounts:
            - mountPath: /data
              name: mcbedrock-storage1
      restartPolicy: Always
      volumes:
        - name: mcbedrock-storage1
          persistentVolumeClaim:
            claimName: mcbedrock-storage1
status: {}
