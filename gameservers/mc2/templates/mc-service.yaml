apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: mcbedrock
  name: mcbedrock
spec:
  ports:
    - name: "tcp-19132"
      port: 19132
      targetPort: 19132
      protocol: TCP
    - name: "tudp-7551"
      port: 7551
      targetPort: 7551
      protocol: UDP
{{- $start := atoi (printf "%v" .Values.udpPortRange.start) }}
{{- $end := atoi (printf "%v" .Values.udpPortRange.end) }}
{{- $exclusiveEnd := atoi (printf "%d" (add1 $end)) }}
{{- range $port := untilStep $start $exclusiveEnd 1 }}
    - name: "udp-{{ $port }}"
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: UDP
{{- end }}
  type: LoadBalancer
  selector:
    io.kompose.service: mcbedrock
