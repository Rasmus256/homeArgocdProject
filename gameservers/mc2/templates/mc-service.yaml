apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: mcbedrock
  name: mcbedrock
spec:
  ports:
    - name: "tcp-19132"
      port: 19132
      targetPort: 19132
      protocol: TCP
{{- $start := int .Values.udpPortRange.start }}
{{- $end := int .Values.udpPortRange.end }}
{{- range $port := untilStep $start (add1 $end) 1 }}
    - name: "udp-{{ $port }}"
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: UDP
{{- end }}
  type: LoadBalancer
  selector:
    io.kompose.service: mcbedrock
