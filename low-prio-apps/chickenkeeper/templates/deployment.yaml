apiVersion: apps/v1
kind: Deployment
metadata:
  name: chickenkeeper-ui
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: chickenkeeper-ui
spec:
  revisionHistoryLimit: 1
  replicas: 0
  minReadySeconds: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chickenkeeper-ui
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chickenkeeper-ui
    spec:
      containers:
        - securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 99999
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.uiImage.repository }}:{{ .Values.uiImage.tag | toString }}"
          name: chickenkeeper-ui
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "8Mi"
              cpu: "30m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          volumeMounts:
            - mountPath: /tmp
              name: tmpfs-1
      volumes:
        - name: tmpfs-1
          emptyDir: {}
      restartPolicy: Always
status: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chickenkeeper-backend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: chickenkeeper-backend
spec:
  revisionHistoryLimit: 1
  replicas: 0
  minReadySeconds: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chickenkeeper-backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chickenkeeper-backend
    spec:
      containers:
        - env:
          - name: DATABASE_URL
            value: "postgresql://chickenkeeper:password@postgres:5432/chickenkeeper"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 99999
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | toString }}"
          name: chickenkeeper-backend
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "16Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            timeoutSeconds: 5
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - mountPath: /tmp
              name: tmpfs-1
      volumes:
        - name: tmpfs-1
          emptyDir: {}
      restartPolicy: Always
status: {}
