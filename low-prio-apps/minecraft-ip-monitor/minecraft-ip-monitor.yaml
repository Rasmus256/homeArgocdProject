apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft-ip-monitor
  namespace: argocd
  labels:
    "category": "low-prio"
spec:
  destination:
    namespace: minecraft-ip-monitor
    server: 'https://kubernetes.default.svc'
  source:
    path: low-prio-apps/minecraft-ip-monitor
    repoURL: 'git@github.com:Rasmus256/homeArgocdProject.git'
    targetRevision: HEAD
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
