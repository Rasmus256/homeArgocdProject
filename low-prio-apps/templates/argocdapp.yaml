apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Rasmus256/homeArgocdProject.git'
    targetRevision: HEAD
    path: apps/ollama # Tilpas sti
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true