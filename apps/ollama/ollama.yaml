apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
# --- PVC TIL OLLAMA MODELLER ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path  # K3s standard StorageClass
  resources:
    requests:
      storage: 20Gi              # Nok plads til et par 7B/8B modeller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        hardware-tier: fast    # Eller kubernetes.io/hostname: <GEN8_NODE>

      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: http
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "10Gi"
            cpu: "3"            # Fin grænse til din i5-8265U (efterlader tråde til OS)
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: ollama-pvc # Bruger PVC i stedet for hostPath
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
spec:
  type: ClusterIP
  ports:
  - port: 11434
    targetPort: 11434
    name: http
  selector:
    app: ollama